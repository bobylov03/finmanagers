services:
  wallets:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - wallets-data:/app/data
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-12}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFY_HOUR: ${NOTIFY_HOUR:-19}
    restart: unless-stopped
volumes:
  wallets-data:
