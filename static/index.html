<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17352b">
<title>Остатки по кошелькам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v4c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6M5 10v4c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-4M5 14v4c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-4"/></svg></div>
      <b>Остатки по кошелькам</b>
      <span>MVP · ТЗ v1.3</span>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <button type="button" class="cmd-open" id="cmdBtn" onclick="openCmd()" title="Ctrl+K">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span>Найти раздел или действие</span><kbd>Ctrl K</kbd>
      </button>
      <div class="grow"></div>
      <div class="datebox">
        <label for="curDate">Отчёты на</label>
        <input type="date" id="curDate">
        <span id="dateQuick" class="row"></span>
      </div>
      <span id="periodTag"></span>
      <span id="userTags" class="hidden"></span>
      <div class="popwrap" id="bellWrap">
        <button type="button" class="btn bell" id="bell" title="Уведомления">Уведомления <span class="dot hidden" id="bellDot"></span></button>
        <div id="bellPop"></div>
      </div>
      <span id="langBox"></span>
      <div class="popwrap field" id="userBox"></div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="modalHost"></div>
<div id="cmdHost"></div>
<div id="login" class="scrim hidden" style="background:var(--paper);align-items:center"></div>
<div id="busy" class="hidden" role="status" aria-live="polite"></div>
<script src="/static/js/core.js"></script>
<script src="/static/js/shell.js"></script>
<script src="/static/js/reports.js"></script>
<script src="/static/js/docs.js"></script>
<script src="/static/js/admin.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/i18n-en.js"></script>
<script src="/static/js/init.js"></script>
</body>
</html>
