<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c1626">
<title>Остатки по кошелькам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3"/></svg></div>
      <b>Остатки по кошелькам</b>
      <span>MVP · ТЗ v1.3</span>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="field date">
        <label for="curDate">Дата отчётов</label>
        <input type="date" id="curDate">
      </div>
      <span id="periodTag"></span>
      <div class="grow"></div>
      <span id="userTags" class="row"></span>
      <span class="bell btn sm" id="bell" title="Уведомления">Уведомления <span class="dot hidden" id="bellDot"></span></span>
      <span id="langBox"></span>
      <div class="field" id="userBox"></div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="modalHost"></div>
<div id="login" class="scrim hidden" style="background:var(--paper);align-items:center"></div>
<div id="busy" class="hidden" role="status" aria-live="polite"></div>
<script src="/static/js/core.js"></script>
<script src="/static/js/shell.js"></script>
<script src="/static/js/reports.js"></script>
<script src="/static/js/docs.js"></script>
<script src="/static/js/admin.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/i18n-en.js"></script>
<script src="/static/js/init.js"></script>
</body>
</html>
